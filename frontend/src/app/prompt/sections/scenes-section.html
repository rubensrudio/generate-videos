<div class="scenes-section">
  @for (scene of scenes.controls; track scene; let i = $index) {
    <fieldset class="scene-block">
      <legend>Cena {{ i + 1 }}</legend>

      <app-text-field
        [control]="scene.controls.id"
        [fieldId]="fieldId(i, 'id')"
        label="Identificador"
        [required]="true"
        [maxLength]="shortTextMax"
      />

      <app-text-field
        [control]="scene.controls.title"
        [fieldId]="fieldId(i, 'title')"
        label="Título"
        [required]="true"
        [maxLength]="shortTextMax"
      />

      <app-text-field
        [control]="scene.controls.narration"
        [fieldId]="fieldId(i, 'narration')"
        label="Narração"
        [required]="true"
        [multiline]="true"
        [maxLength]="longTextMax"
      />

      <app-text-field
        [control]="scene.controls.startFrame"
        [fieldId]="fieldId(i, 'startFrame')"
        label="Frame inicial"
        [required]="true"
        [maxLength]="shortTextMax"
        inputMode="numeric"
      />

      <app-text-field
        [control]="scene.controls.endFrame"
        [fieldId]="fieldId(i, 'endFrame')"
        label="Frame final"
        [required]="true"
        [maxLength]="shortTextMax"
        inputMode="numeric"
      />

      <app-text-field
        [control]="scene.controls.content"
        [fieldId]="fieldId(i, 'content')"
        label="Conteúdo"
        [required]="true"
        [multiline]="true"
        [maxLength]="longTextMax"
      />

      <app-text-field
        [control]="scene.controls.animation"
        [fieldId]="fieldId(i, 'animation')"
        label="Animação"
        [multiline]="true"
        [maxLength]="longTextMax"
      />

      <app-text-field
        [control]="scene.controls.fadeOutFrame"
        [fieldId]="fieldId(i, 'fadeOutFrame')"
        label="Frame de fade-out"
        [maxLength]="shortTextMax"
        inputMode="numeric"
      />

      <div class="scene-actions">
        <button
          type="button"
          [id]="'btn-remove-scene-' + i"
          (click)="removeScene(i)"
          [disabled]="!canRemove()"
        >
          Remover cena
        </button>
        <button
          type="button"
          [id]="'btn-move-up-scene-' + i"
          (click)="moveUp(i)"
          [disabled]="!canMoveUp(i)"
        >
          Mover para cima
        </button>
        <button
          type="button"
          [id]="'btn-move-down-scene-' + i"
          (click)="moveDown(i)"
          [disabled]="!canMoveDown(i)"
        >
          Mover para baixo
        </button>
      </div>
    </fieldset>
  }

  <div class="scenes-add">
    <button type="button" id="btn-add-scene" (click)="addScene()" [disabled]="!canAdd()">
      Adicionar cena
    </button>
    @if (!canAdd()) {
      <p>Limite de 30 cenas atingido</p>
    }
  </div>

  @if (showNoValidSceneError()) {
    <p class="scenes-error" role="alert">Adicione pelo menos uma cena</p>
  }

  <div role="status" class="timeline-warnings">
    @for (warning of warnings(); track warning) {
      <p>{{ warning }}</p>
    }
  </div>
</div>
